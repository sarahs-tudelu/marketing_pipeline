services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: social
      POSTGRES_USER: social
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social -d social"]
      interval: 5s
      retries: 10
  migrate:
    build: .
    env_file: ${LOCAL_ENV_FILE:-.env.local}
    environment:
      DATABASE_URL: postgresql+psycopg://social:${POSTGRES_PASSWORD}@db/social
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
    volumes: ["runtime:/app/data"]
  web:
    build: .
    env_file: ${LOCAL_ENV_FILE:-.env.local}
    environment:
      DATABASE_URL: postgresql+psycopg://social:${POSTGRES_PASSWORD}@db/social
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["runtime:/app/data"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    build: .
    env_file: ${LOCAL_ENV_FILE:-.env.local}
    environment:
      DATABASE_URL: postgresql+psycopg://social:${POSTGRES_PASSWORD}@db/social
    command: ["tudelu", "worker"]
    volumes: ["runtime:/app/data"]
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  postgres:
  runtime:
