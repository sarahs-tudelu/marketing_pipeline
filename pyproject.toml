[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tudelu-social"
version = "0.1.0"
description = "Auditable, official-API promotional publishing for Tudelu"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0.36,<3",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1", "cryptography>=44,<48", "apscheduler>=3.11,<4",
  "jinja2>=3.1.5,<4", "python-multipart>=0.0.20,<1", "PyYAML>=6,<7",
  "Pillow>=11,<13", "boto3>=1.36,<2", "portalocker>=3,<4", "tzdata>=2025.1",
  "itsdangerous>=2.2,<3",
  "av>=14,<20", "numpy>=2,<3",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]
[project.scripts]
tudelu = "social.cli:main"
[tool.setuptools.packages.find]
include = ["social*"]
[tool.setuptools.package-data]
social = ["templates/*.html", "static/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
