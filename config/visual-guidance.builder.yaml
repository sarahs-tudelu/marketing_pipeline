purpose: Product appearance and motion constraints adapted from the Tudelu AI Builder for social images
  and videos. These guide depictions, not structural certification, availability, prices, installation
  instructions or additional caption claims. Caption claims still require approved fact IDs. Only the
  product profiles below are configured for generation.
