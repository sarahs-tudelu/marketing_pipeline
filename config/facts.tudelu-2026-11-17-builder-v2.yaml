  policy_metadata:
    reviewed_on: '2026-11-17'
    evidence_level: first_party_website_observation
    independent_testing_performed: false
    company_approval_record: null
    policy_origin: Factual entries are based on the cited pages. Wording restrictions, freshness intervals,
      and pipeline rules are editorial controls created for this request; they are not represented as
      existing Tudelü company policies.
    generation_authority: Only facts[].text and facts[].variants are caption allowlists.
    unestablished_facts:
      policy: These are not established in this file. Do not fill gaps with guesses or imply that a missing
        fact is false. Add evidence before using them in either content mode.
      categories:
      - Founding year, founder biography, headquarters, factory location, or country of origin.
      - Made-in-USA claims, employee counts, installation counts, awards, or named clients.
      - Geographic sales coverage, local installers, distributor exclusivity, or service response times.
      - Fire ratings, accessibility compliance, code approvals, certifications, or structural capacities.
      - Sustainability credentials, recycled content, carbon savings, or environmental superiority.
      - Productivity, health, learning, revenue, property-value, ROI, or energy-bill improvements.
      - Sales offers, coupons, financing, free consultations, free samples, or limited stock.
      - Exact operating speed, product lifespan, sound reduction, or weather-protection percentage.
    restricted_claims_not_approved_copy:
      defaults:
        status: withheld_pending_evidence
        eligible_for_generation: false
        release_rule: A reviewer must examine the specified evidence and add narrowly scoped wording to
          claim_registry. A disclaimer, a reviewer click, or 'may/can/up to' alone cannot make an unsupported
          claim eligible.
      entries:
        acoustic_rating:
          source_ids:
          - walls
          - systems
          observation: The site lists an STC 48 option and an 8-inch double-wall MUTE construction.
          evidence_needed: Applicable acoustic report, assembly identification, test conditions, and approved
            wording.
          prohibit_inferences:
          - Complete silence
          - 48 dB reduction in every room
          - Guaranteed speech privacy
        canopy_insulation:
          source_ids:
          - canopies
          observation: An insulation range is published as R-12.5 to 26.
          evidence_needed: Panel specification, thickness, units, test basis, and configuration applicability.
          prohibit_inferences:
          - Guaranteed temperature decrease
          - Energy savings
          - Whole-building R-value
        pergola_lighting_spec:
          source_ids:
          - pergolas
          observation: The page describes three lighting layouts with 3000K LEDs.
          evidence_needed: Current component specification and the lighting included in the selected configuration.
          prohibit_inferences:
          - All packages include lighting
          - Universal dimming or smart-home compatibility
        shipping_speed:
          source_ids:
          - canopies
          observation: The canopy page makes a broad rapid-shipment claim.
          evidence_needed: Current product-specific production and shipment confirmation with exclusions
            and timing basis.
          prohibit_inferences:
          - Delivery within days
          - Guaranteed arrival
          - No lead time
        comparative_price:
          source_ids:
          - canopies
          observation: Canopy marketing makes lower-price comparisons.
          evidence_needed: Dated like-for-like comparison covering design, scope, freight, installation,
            and market.
          prohibit_inferences:
          - Cheapest option
          - Lower total installed cost for every project
          - Guaranteed savings
        lifetime_and_maintenance:
          source_ids:
          - canopies
          observation: Durability and cleaning claims are stated in absolute terms.
          evidence_needed: Applicable warranty, care instructions, exposure limits, and substantiated
            service-life evidence.
          prohibit_inferences:
          - Lifetime performance
          - No cleaning
          - No corrosion
          - No maintenance
          - Permanent finish
        patents_and_exclusivity:
          source_ids:
          - canopies
          observation: The canopy page asserts patent protection and uniqueness.
          evidence_needed: Patent identifiers, jurisdiction, status, ownership, and the exact protected
            scope.
          prohibit_inferences:
          - Every component patented
          - No equivalent exists
          - Competitors infringe
        installation_equipment_and_accessories:
          source_ids:
          - canopies
          observation: Assembly, equipment, and fixture compatibility are described broadly.
          evidence_needed: Approved installation scope, access plan, lifting requirements, and accessory
            load/attachment details.
          prohibit_inferences:
          - No lift ever required
          - Anyone can install it
          - Any fixture fits
          - No engineering needed
        model_warranty_and_crew:
          source_ids:
          - wall_manual
          - terms
          observation: The TMV2-001 web overview lists a 10-year warranty and two installers; sale terms
            reference a separate warranty.
          evidence_needed: Applicable warranty document and installation plan for the exact product and
            revision.
          prohibit_inferences:
          - Ten years on every system
          - Unconditional coverage
          - Fixed labor requirement on every site
        control_and_safety:
          source_ids:
          - walls
          observation: Wall controls, automation integration, and monitoring features are described.
          evidence_needed: Current controls documentation, supported interfaces, and configuration-specific
            safety documentation.
          prohibit_inferences:
          - Works with every smart-home platform
          - Childproof
          - Injury-proof
          - Fail-safe in every condition
        shipping_inclusions:
          source_ids:
          - terms
          observation: Published sale terms exclude shipping from the purchase price.
          evidence_needed: Current applicable quote and any explicitly approved campaign exception.
          prohibit_inferences:
          - Free shipping
          - All-inclusive catalog price
          - Installation included
        project_proof:
          source_ids:
          - installations
          - about
          observation: Reviewed pages do not establish a verified named customer case study for reuse.
          evidence_needed: Project record, actual installed configuration, image rights, customer permission,
            and substantiated results.
          prohibit_inferences:
          - Invented completed project
          - Fabricated testimonial
          - Assumed client endorsement
        ai_studio_promises:
          source_ids:
          - studio
          - canopy_resources
          observation: Public AI navigation is visible; full interactive behavior was not verified.
          evidence_needed: Tested current workflow and evidence for each advertised capability or commercial
            commitment.
          prohibit_inferences:
          - Instant permit-ready design
          - Automatic structural approval
          - Guaranteed price
          - Every concept buildable
    visual_policy:
      same_evidence_standard_as_text: true
      asset_types:
      - verified_installation
      - product_photo
      - product_render
      - ai_concept
      - diagram
      required_asset_metadata:
      - asset_id
      - asset_type
      - source_or_creation_record
      - product_family
      - rights_status
      rules:
      - Do not label a render or AI-generated scene as a completed installation, customer project, or
        before/after result.
      - AI labels are applied through platform-native AI flags and embedded metadata, not caption or
        on-image text. Never present an AI scene as a real photograph, installation or customer project.
      - Product-specific renders must respect known geometry, operation, materials, and supported options.
      - Do not animate fixed pergola louvers opening or show impossible spans, attachments, or equipment.
      - Do not show a rain-sealed open-louver roof, total sound isolation, or measured cooling without
        evidence.
      - A concept label does not excuse depicting an unavailable feature as a current Tudelü offering.
      - Do not add client logos, certification marks, testimonials, or project locations without verified
        authorization.
      - Image and video claims must be reviewed alongside captions, overlays, and audio.
      unknown_asset_provenance: hold_asset_or_replace
