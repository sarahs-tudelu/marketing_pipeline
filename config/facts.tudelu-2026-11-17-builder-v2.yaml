brand_voice: 'Clear, calm, concrete, design-aware, and useful. This is a website-supported

  snapshot reviewed 2026-11-04, not independent testing or a new warranty. Select only

  exact text or variants from facts. Treat the qualifications within each sentence as

  inseparable. Do not paraphrase, remove conditions, turn maximums into universal

  capabilities, or transfer features between products or mounting arrangements.


  Both promotional and non-promotional posts use the same evidence standard.

  Promotional content may introduce a supported feature; it need not promise an

  outcome. Non-promotional content should favor E-prefixed educational facts, planning

  questions, and the education product tag. Avoid sales CTAs for educational content.

  The contact, shop, and design_studio tags contain optional promotional destinations.


  Do not infer performance from images. No invented prices, discounts, delivery times,

  warranties, statistics, testimonials, client projects, certifications, patents,

  country-of-origin claims, sustainability claims, business outcomes, or superiority.

  No absolute sound isolation, privacy, weather protection, durability, maintenance,

  installation, or automation-compatibility promises. Fixed pergola louvers do not

  rotate or retract. Open louvers do not form a waterproof roof. MUTE''s side-mounted

  maximum is separate from its general dimensional guidance.


  Do not imply that illustrated lighting, supports, finishes, accessories, installation,

  or engineering documents are included with every order. Do not describe forthcoming

  product families as available to order. No release date is approved. Qualifying a

  claim with ''may'', ''can'', or ''up to'' does not supply missing evidence.


  Product renders and AI concepts are illustrative, never proof of completed projects,

  customer endorsement, structural feasibility, or measured performance. Reject

  misleading text, images, overlays, video, or claim combinations. Check the entire

  post, not only literal sentences. A disclaimer cannot repair an unsupported promise.

  If evidence or the applicable source is missing, stale, contradictory, or unavailable,

  omit the claim or hold the post. Recheck affected sources before renewing validity.

  Never use the prohibited observations in product metadata as approved caption text.'
