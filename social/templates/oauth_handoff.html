<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Connect {{ platform_name }} · Tudelu Social Studio</title>
  <link rel="stylesheet" href="/static/studio.css">
  <script src="/static/oauth_handoff.js" defer></script>
</head>
<body>
  <main>
    <section class="narrow">
      <h1>Connect {{ platform_name }}</h1>
      <p>Opening {{ platform_name }} to authorize your account.</p>
      <p>If it does not open automatically, use the button below.</p>
      <a id="oauth-continue" class="button primary" href="{{ authorize_url }}" rel="noreferrer">Continue to {{ platform_name }}</a>
      <p><a href="/admin/connections">Back to connections</a></p>
    </section>
  </main>
</body>
</html>
